[package]
name = "mooncake-transfer-engine"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for Mooncake Transfer Engine"
license = "Apache-2.0"

[lib]
name = "mooncake_transfer_engine"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.79"
libc = "0.2"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3.20"
hostname = "0.3"
dns-lookup = "1.0"

[build-dependencies]
bindgen = "0.70"
cmake = "0.1.50"
