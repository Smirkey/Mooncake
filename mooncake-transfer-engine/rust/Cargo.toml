[package]
name = "mooncake-transfer-engine"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for Mooncake Transfer Engine"
license = "Apache-2.0"

[lib]
name = "mooncake_transfer_engine"
path = "src/lib.rs"

[features]
default = []
cli = [
    "dep:clap",
    "dep:dns-lookup",
    "dep:hostname",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "mooncake-transfer-engine"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.79"
clap = { version = "4.4", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3.20", optional = true }
hostname = { version = "0.3", optional = true }
dns-lookup = { version = "1.0", optional = true }

[build-dependencies]
bindgen = "0.70"
